name: Deploy To Portainer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portainer-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_LOGIN_IMAGE_URL=${{ secrets.VITE_LOGIN_IMAGE_URL }}
            VITE_HEADER_IMAGE_URL=${{ secrets.VITE_HEADER_IMAGE_URL }}
            VITE_CAFE_IMAGE_URL=${{ secrets.VITE_CAFE_IMAGE_URL }}
            VITE_SISTER_PLATFORM_URL=${{ secrets.VITE_SISTER_PLATFORM_URL }}
            VITE_DISCORD_IMAGE_URL=${{ secrets.VITE_DISCORD_IMAGE_URL }}
            VITE_DISCORD_INVITE_URL=${{ secrets.VITE_DISCORD_INVITE_URL }}
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer stack webhook
        env:
          PORTAINER_STACK_WEBHOOK_URL: ${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}
          PORTAINER_WEBHOOK_INSECURE_TLS: ${{ secrets.PORTAINER_WEBHOOK_INSECURE_TLS }}
        run: |
          if [ -z "$PORTAINER_STACK_WEBHOOK_URL" ]; then
            echo "PORTAINER_STACK_WEBHOOK_URL is empty. Skipping webhook trigger."
            exit 0
          fi
          FLAG="$(echo "${PORTAINER_WEBHOOK_INSECURE_TLS:-}" | tr '[:upper:]' '[:lower:]' | xargs)"
          CURL_INSECURE=""
          echo "Portainer webhook insecure TLS flag: ${FLAG:-<empty>}"
          if [ "$FLAG" = "true" ] || [ "$FLAG" = "1" ] || [ "$FLAG" = "yes" ]; then
            CURL_INSECURE="--insecure"
            echo "Using insecure TLS for Portainer webhook (PORTAINER_WEBHOOK_INSECURE_TLS=true)."
          fi
          curl -fsS $CURL_INSECURE -X POST "$PORTAINER_STACK_WEBHOOK_URL"
          echo "Portainer webhook triggered."

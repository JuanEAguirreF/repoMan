name: Deploy To Portainer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portainer-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/repoman-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_LOGIN_IMAGE_URL=${{ secrets.VITE_LOGIN_IMAGE_URL }}
            VITE_HEADER_IMAGE_URL=${{ secrets.VITE_HEADER_IMAGE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer stack webhook
        env:
          PORTAINER_STACK_WEBHOOK_URL: ${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_STACK_WEBHOOK_URL" ]; then
            echo "PORTAINER_STACK_WEBHOOK_URL is empty. Skipping webhook trigger."
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_STACK_WEBHOOK_URL"
          echo "Portainer webhook triggered."

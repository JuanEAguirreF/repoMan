services:
  backend:
    image: ghcr.io/juaneaguirref/repoman-backend:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: https://repoman.example.com
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-repoman/covers}
      STORAGE_ROOT: /app/backend/uploads
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-52428800}
      MAX_COVER_SIZE_BYTES: ${MAX_COVER_SIZE_BYTES:-5242880}
      COVER_TARGET_MAX_WIDTH: ${COVER_TARGET_MAX_WIDTH:-400}
      COVER_TARGET_MAX_BYTES: ${COVER_TARGET_MAX_BYTES:-256000}
    volumes:
      - repoman_uploads:/app/backend/uploads
    expose:
      - "4000"
    networks:
      - repoman_net
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-coolify}"
      - "traefik.http.routers.repoman-api.rule=Host(`${API_DOMAIN:-apirepoman.comunidaddelmanga.com}`)"
      - "traefik.http.routers.repoman-api.entrypoints=websecure"
      - "traefik.http.routers.repoman-api.tls=true"
      - "traefik.http.routers.repoman-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.repoman-api.service=repoman-api-svc"
      - "traefik.http.services.repoman-api-svc.loadbalancer.server.port=4000"

  frontend:
    image: ghcr.io/juaneaguirref/repoman-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - repoman_net
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-coolify}"
      - "traefik.http.routers.repoman-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.repoman-web.entrypoints=websecure"
      - "traefik.http.routers.repoman-web.tls=true"
      - "traefik.http.routers.repoman-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.repoman-web.service=repoman-web-svc"
      - "traefik.http.services.repoman-web-svc.loadbalancer.server.port=80"

networks:
  repoman_net:
    driver: bridge
  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-coolify}

volumes:
  repoman_uploads:
